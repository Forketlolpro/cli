[tool.ruff]
# Длина строки (совпадает с Black)
line-length = 108

# Отступы в пробелах
indent-width = 4

# Минимальная поддерживаемая версия Python
target-version = "py310"

[tool.ruff.lint]
# Включить базовый набор правил (F, E, W, B, UP и др.)
select = [
    "ALL"
]

# Игнорировать отдельные правила при необходимости
ignore = ["D100", "CPY001", "D103", "D102", "D101", "D203", "D105", "D213", "S101"]

# Автоматические исправления
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Использовать двойные кавычки (как в Black)
quote-style = "double"

# Стиль отступов
indent-style = "space"

# Форматировать код внутри docstring
docstring-code-format = true



[tool.pyrefly]
project-includes = [
    "src/**/*.py*",
    "src/**/*.ipynb",
]

[tool.pytest.ini_options]
    pythonpath = ["."]
    minversion = "9.0"
    testpaths = ["tests"]
    python_files = ["test_*.py", "*_test.py"]
    addopts = ["-vv", "-ra", "-q", "--import-mode=importlib"]
